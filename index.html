<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cap or Fact?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* One world: a cobalt town. The phone is the only bright surface in it.
     Yellow belongs to the truth (the note, the marker, the way forward).
     Coral and mint are the two verdict stamps and the two things that spread. */
  --field:#2A3AD2;
  --field-deep:#1D2AA6;
  --field-soft:#7C89F4;
  --on-field:#FFFFFF;
  --on-field-quiet:#D3D8FF;
  --surface:#FFFFFF;
  --tint:#EEF0FB;
  --line:#D4D8EE;
  --ink:#131735;
  --muted:#565C80;
  --marker:#FFD93B;
  --fake:#D93A27;      --fake-lit:#FF8571;
  --real:#0B8257;      --real-lit:#7BF0C2;
  --display:"Barlow Condensed","ZCOOL QingKe HuangYou","Noto Sans SC",Impact,"Arial Narrow",sans-serif;
  --body:"Instrument Sans","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Layout: the left column is the phone you act on. The right half of the page is the town, unboxed, living with your choices. */
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  /* Field tokens. Home is cobalt; the other screens override these below. */
  --net-line:rgba(255,255,255,.17); --pop:var(--marker); --on-pop:var(--ink); --guard:#FFFFFF;
  background:var(--field);color:var(--on-field);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  transition:background-color .45s ease,color .45s ease}
/* Act 1, the forging workshop: stamp red. Slightly deeper than the transition's ink so the reveal edge reads. */
body[data-screen="pickStory"],body[data-screen="forge"],body[data-screen="forgeEnd"]{
  --field:#C2301E; --field-deep:#9C2213; --field-soft:#F0A497; --net-line:rgba(255,255,255,.2);
  --on-field-quiet:#FFDCD5; --fake-lit:#23102E; --real-lit:#8FF5CD; --guard:#FFFFFF}
/* Act 2, the feed: night ink, a shade lighter than the drop so the lens edge reads. */
body[data-screen="feed"]{
  --field:#151A44; --field-deep:#0B0E2C; --field-soft:#56619F; --net-line:rgba(255,255,255,.13);
  --on-field-quiet:#B9BFE8; --fake-lit:#FF8571; --real-lit:#7BF0C2; --guard:#FFFFFF}
/* Results: the magnifier's yellow, with ink text. */
body[data-screen="result"]{
  --field:#FFD93B; --field-deep:#EBC21C; --field-soft:#B6972A; --net-line:rgba(19,23,53,.16);
  --on-field:#131735; --on-field-quiet:#5A4B12; --fake-lit:#C42F1D; --real-lit:#0B7A51;
  --pop:#131735; --on-pop:#FFD93B; --guard:#131735}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--pop);outline-offset:3px}
.phone :focus-visible{outline-color:var(--ink)}
.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;font-synthesis:none;line-height:.95;text-wrap:balance}

.app{max-width:1180px;margin:0 auto;padding:16px 20px 64px}

/* top bar */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-size:26px;font-weight:900;letter-spacing:.01em}
.steps{display:flex;gap:4px;margin-left:8px}
.steps li{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;color:var(--on-field-quiet)}
.steps li.now{background:var(--pop);color:var(--on-pop)}
.steps li.done{color:var(--on-field)}
.spacer{flex:1}
.score{position:relative;font-weight:700;font-variant-numeric:tabular-nums}
.delta{position:absolute;right:0;top:-2px;font-weight:800;font-size:15px;pointer-events:none;animation:floatUp 1.1s ease-out forwards}
.delta.up{color:var(--real-lit)}
.delta.down{color:var(--fake-lit)}
@keyframes floatUp{0%{transform:translateY(4px);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.lang{display:flex;border:1.5px solid var(--on-field-quiet);border-radius:999px;padding:2px}
.lang button{border:0;background:none;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--on-field)}
.lang button[aria-pressed="true"]{background:var(--on-field);color:var(--field)}

/* page grid */
.grid{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:44px;align-items:start;margin-top:24px}
body[data-screen="intro"] .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stage{display:flex;flex-direction:column;gap:18px;min-width:0}

/* intro */
.title{display:flex;flex-wrap:wrap;align-items:center;gap:.08em .14em;font-size:clamp(76px,11.5vw,156px);font-weight:900;line-height:.9;padding:.06em 0 .1em}
.title .st{border:.065em solid currentColor;border-radius:.13em;padding:0 .14em .05em}
.title .st.fake{color:var(--fake-lit);transform:rotate(-4deg)}
.title .st.real{color:var(--real-lit);transform:rotate(2.5deg)}
.title .or{font:600 .2em/1 var(--body);text-transform:none;color:var(--on-field-quiet)}
.gloss{font-size:14px;color:var(--on-field-quiet)}
.lede{font-size:clamp(28px,3.8vw,42px)}
.lead{max-width:46ch;font-size:17px}
.acts{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--field-soft);padding-top:18px}
.acts li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:baseline}
.acts .n{font-size:44px;color:var(--marker);grid-row:span 2}
.acts h3{font-size:24px}
.acts p{color:var(--on-field-quiet);font-size:15px;max-width:52ch}
.statline{font-size:14px;color:var(--on-field-quiet);max-width:60ch}
.statline b{color:var(--on-field);font-weight:600}

/* buttons */
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px;line-height:1.2;background:var(--ink);color:#fff}
.btn.cta{background:var(--marker);color:var(--ink);font-size:17px;padding:15px 26px}

/* story picker (start of Act 1) */
.stories{display:flex;flex-direction:column;gap:12px}
.story{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;border:0;border-radius:18px;padding:16px 18px;background:var(--surface);color:var(--ink);box-shadow:0 18px 30px -22px rgba(7,11,74,.9);transition:transform .15s ease}
.story:nth-child(odd){transform:rotate(-.6deg)}
.story:nth-child(even){transform:rotate(.5deg)}
.story-truth{font-size:16.5px;line-height:1.45}
.story-go{font-size:14px;font-weight:700;background:var(--marker);border-radius:999px;padding:6px 14px}
.story-last{position:absolute;top:-9px;right:14px;font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px}
.story:active{transform:scale(.98)}

/* forger score card (end of Act 1) */
.fscore{background:var(--surface);color:var(--ink);border-radius:22px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 34px 60px -30px rgba(7,11,74,.85)}
.fs-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.fs-num{display:grid;grid-template-columns:auto auto;align-items:end;column-gap:4px}
.fs-label{grid-column:1 / -1;font-size:13px;font-weight:700;color:var(--muted)}
.fs-num b{font:900 68px/.86 var(--display);color:var(--fake);font-variant-numeric:tabular-nums;min-width:2ch}
.fs-num small{font-size:16px;font-weight:700;color:var(--muted);padding-bottom:4px}
.fs-rank{display:flex;flex-direction:column;gap:4px}
.fs-rank b{font-size:28px;line-height:1}
.fs-rank span{font-size:14px;line-height:1.4;color:var(--muted)}
.fs-meter{height:10px;border-radius:999px;background:var(--tint);overflow:hidden}
.fs-meter i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--marker),var(--fake));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.fs-steps{display:flex;flex-direction:column}
.fs-steps li{display:grid;grid-template-columns:5.5em auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.fs-slot{font-weight:600}
.fs-slot::first-letter{text-transform:uppercase}
.pill.fs-honest{background:var(--real);color:#fff}
.pill.fs-mild{background:var(--marker);color:var(--ink)}
.pill.fs-fake{background:var(--fake);color:#fff}
.fs-trick{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.fs-mult{font-weight:700;font-variant-numeric:tabular-nums}
.fs-note{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:reduce){.fs-meter i{transition:none}}

/* difficulty picker and settings */
.settings{display:flex;flex-wrap:wrap;gap:12px 32px}
.levels{display:flex;flex-direction:column;gap:8px}
.levelrow{display:flex;flex-wrap:wrap;gap:8px}
.level{border:1.5px solid var(--on-field-quiet);background:none;color:var(--on-field);border-radius:999px;padding:8px 18px;font-weight:700;font-size:15px}
.level[aria-pressed="true"]{background:var(--on-field);color:var(--field);border-color:var(--on-field)}

/* scene transitions */
.fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;cursor:pointer;touch-action:none}

/* home button and quit dialog */
.homebtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--on-field-quiet);background:none;color:var(--on-field);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;font-weight:600}
.homebtn svg{width:16px;height:16px}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,60,.62)}
.dialog{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));background:var(--surface);color:var(--ink);border-radius:22px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 34px 60px -24px rgba(7,11,74,.9)}
.dialog h2{font-size:34px}
.dialog p{font-size:15.5px;color:var(--muted)}
.dialog-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.dialog-btns .btn{flex:1 1 150px}
.btn.quit{background:var(--surface);color:var(--fake);box-shadow:inset 0 0 0 1.5px var(--fake)}
.dialog :focus-visible{outline-color:var(--ink)}
body.modal-open .timer i{animation-play-state:paused}

/* first-round guide */
.guidebtn{border:1.5px solid var(--on-field-quiet);background:none;color:var(--on-field);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.guidebtn[aria-pressed="true"]{background:var(--pop);border-color:var(--pop);color:var(--on-pop)}
.coach{position:relative;background:var(--ink);color:#fff;border-left:6px solid var(--marker);border-radius:14px;padding:12px 16px 13px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.45;text-align:left}
.coach::after{content:"";position:absolute;left:26px;width:16px;height:16px;background:var(--ink);transform:rotate(45deg);display:none}
.coach.down::after{display:block;bottom:-7px}
.coach.up::after{display:block;top:-7px}
.coach-btns{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.coach-btns:empty{display:none}
.coach-next{border:0;border-radius:999px;background:var(--marker);color:var(--ink);font-weight:700;font-size:14px;padding:8px 18px}
.coach :focus-visible{outline-color:var(--marker)}
.guided{outline:3px solid var(--marker);outline-offset:5px}
.phone .guided{outline-color:var(--ink);box-shadow:0 0 0 11px var(--marker)}

/* brief: the words outside the phone */
.brief{display:flex;flex-direction:column;gap:6px}
.kicker{font-size:14px;font-weight:600;color:var(--on-field-quiet)}
.h2{font-size:clamp(36px,5vw,50px)}
.truth{background:var(--marker);color:var(--ink);padding:12px 14px 13px;border-radius:3px;transform:rotate(-.7deg);font-size:15px;line-height:1.45;box-shadow:0 10px 18px -12px rgba(7,11,74,.8)}
.truth b{display:block;font-size:13px}
.truth i{display:block;font-style:normal;font-weight:600;margin-top:6px}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:0;border-radius:14px;padding:12px 16px;font-size:15.5px;line-height:1.35;font-weight:500}
.fine{font-size:14px;color:var(--on-field-quiet);max-width:56ch}

/* the phone */
.phone{background:var(--surface);color:var(--ink);border-radius:28px;box-shadow:0 34px 60px -30px rgba(7,11,74,.85);overflow:hidden}
.phone.glow-good{animation:glowGood 1s ease-out}
.phone.glow-bad{animation:glowBad 1s ease-out}
.phone.glow-bad.shake{animation:glowBad 1s ease-out,shakeX .42s ease-in-out}
@keyframes glowGood{0%{box-shadow:0 0 0 0 rgba(11,130,87,.9),0 34px 60px -30px rgba(7,11,74,.85)}100%{box-shadow:0 0 0 22px rgba(11,130,87,0),0 34px 60px -30px rgba(7,11,74,.85)}}
@keyframes glowBad{0%{box-shadow:0 0 0 0 rgba(217,58,39,.95),0 34px 60px -30px rgba(7,11,74,.85)}100%{box-shadow:0 0 0 22px rgba(217,58,39,0),0 34px 60px -30px rgba(7,11,74,.85)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* result bar at the top of the phone after each call */
.verdictbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;border-radius:16px;padding:10px 14px 10px 10px;color:#fff;background:var(--muted)}
.verdictbar.good{background:var(--real)}
.verdictbar.bad{background:var(--fake)}
.verdictbar.safe{background:var(--marker);color:var(--ink)}
.verdictbar.fresh{animation:barIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes barIn{from{transform:translateY(-14px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.vb-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 22px/1 var(--body);background:rgba(255,255,255,.22)}
.verdictbar.safe .vb-icon{background:rgba(19,23,53,.12)}
.verdictbar.fresh .vb-icon{animation:iconPop .5s .12s cubic-bezier(.2,1.8,.4,1) both}
@keyframes iconPop{from{transform:scale(.2) rotate(-30deg)}to{transform:none}}
.vb-text{display:flex;flex-direction:column;line-height:1.2}
.vb-text b{font-size:18px}
.vb-text small{font-size:13px;font-weight:600;opacity:.92}
.vb-pts{font:800 19px/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.appbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 20px 11px;border-bottom:1px solid var(--line)}
.appbar .logo{font-size:23px;font-weight:900;letter-spacing:.02em}
.appbar span{font-size:13px;font-weight:600;color:var(--muted)}
.screen{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.sub{font-size:13px;font-weight:600;color:var(--muted)}

.post{position:relative;display:flex;flex-direction:column;gap:10px}
.post header{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--c,#888);color:#fff;display:grid;place-items:center;font:700 17px/1 var(--body);flex:none}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.handle{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ptext{font-size:17px;line-height:1.42;overflow-wrap:anywhere}
.src{font-size:14.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.art{display:block;width:100%;height:auto;border-radius:14px}
.pstats{font-size:13px;color:var(--muted)}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted)}
.slot.now{border:1.5px solid var(--ink);background:var(--marker);color:var(--ink);font-weight:600}
.stamp{position:absolute;right:6px;top:34%;transform:rotate(-11deg);font-size:58px;font-weight:900;letter-spacing:.02em;color:var(--fake);border:5px solid currentColor;border-radius:12px;padding:0 14px 4px;background:rgba(255,255,255,.86);pointer-events:none}
.stamp.real{color:var(--real)}
.stamp.fresh{animation:slam .38s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{from{transform:rotate(-11deg) scale(2.4);opacity:0}to{transform:rotate(-11deg) scale(1);opacity:1}}

.reach{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.reach b{font-size:44px;font-variant-numeric:tabular-nums}
.reach .why{flex-basis:100%;font-size:14px;color:var(--muted)}
.reach .why strong{color:var(--ink)}

/* countdown (Expert only) */
.timerrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--on-field-quiet)}
.timerrow:empty{display:none}
.timer{flex:1;height:8px;border-radius:999px;background:var(--field-deep);overflow:hidden}
.timer i{display:block;height:100%;background:var(--fake-lit);transform-origin:left;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* investigation tray */
.tray{background:var(--tint);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.trayhead{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.dots{display:inline-flex;gap:5px;align-items:center}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--ink)}
.dots i.off{background:none;border:1.5px solid var(--muted)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:11px 4px 9px;font-weight:600;font-size:13px;line-height:1.2;text-align:center}
.tool svg{width:22px;height:22px}
.tool small{font-size:11.5px;font-weight:400;line-height:1.25;color:var(--muted)}
.tool.used small{color:#C9CEEA}
.step{color:var(--ink)}
.tool:disabled{cursor:default;color:var(--muted);background:none;border-color:var(--line)}
.tool.used{background:var(--ink);color:#fff;border-color:var(--ink)}
.ev{background:var(--surface);border-left:5px solid var(--line);border-radius:10px;padding:9px 12px 10px;font-size:14.5px;line-height:1.45}
.ev b{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:2px}
.ev.key{border-left-color:var(--marker)}
.ev .tag{font-size:11.5px;font-weight:700;background:var(--marker);padding:1px 7px;border-radius:999px}
.list{display:flex;flex-direction:column;gap:8px}
.list .ev{background:var(--tint)}
.calls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.call{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--ink);background:var(--surface);border-radius:16px;padding:11px 14px 12px;line-height:1.25}
.call b{font-size:15.5px}
.call small{font-size:12.5px;color:var(--muted);line-height:1.35}

/* outcome */
.outcome{background:var(--tint);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:7px solid var(--line)}
.outcome.good{border-left-color:var(--real)}
.outcome.bad{border-left-color:var(--fake)}
.outcome .cons{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.tchip:disabled{cursor:default;opacity:.5}
.tchip.hit{background:var(--real);color:#fff;border-color:var(--real);opacity:1}
.tchip.miss{background:var(--fake);color:#fff;border-color:var(--fake);opacity:1}

/* the town */
.town{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tally{display:flex;gap:26px;flex-wrap:wrap}
.tally li{display:flex;flex-direction:column;gap:2px}
.tally b{font-size:46px;font-variant-numeric:tabular-nums}
.tally span{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--on-field-quiet)}
.tally i{width:11px;height:11px;border-radius:50%;flex:none}
.tally .m i{background:var(--fake-lit)} .tally .m b{color:var(--fake-lit)}
.tally .g i{background:var(--real-lit)} .tally .g b{color:var(--real-lit)}
.tally .p i{border:3px solid var(--guard)}
.map{position:relative}
#net{display:block;width:100%;aspect-ratio:5/4}
.demo{position:absolute;left:50%;top:50%;width:min(330px,72%);transform:translate(-50%,-50%) rotate(-3deg);background:var(--surface);color:var(--ink);border-radius:22px;padding:16px 18px;box-shadow:0 34px 60px -30px rgba(7,11,74,.85)}
.demo:empty{display:none}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tcard{background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 11px 11px;display:flex;flex-direction:column;gap:4px;min-height:98px}
.tcard:nth-child(odd){transform:rotate(-1.3deg)}
.tcard:nth-child(even){transform:rotate(1.1deg)}
.tcard b{font-size:19px}
.tcard span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.tcard.off{background:var(--field-deep);color:var(--on-field-quiet);justify-content:center;align-items:center}
.tcard.off b{font-size:40px;color:var(--field-soft)}
.tcard.off span{color:var(--on-field-quiet)}

/* results */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--tint);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:40px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:600;color:var(--muted)}
.block{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.recap li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.recap .t{flex:1;min-width:0}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--tint);white-space:nowrap}
.pill.good{background:var(--real);color:#fff}
.pill.bad{background:var(--fake);color:#fff}
.sift li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;padding:4px 0;font-size:15px}
.sift .l{font-size:28px;background:var(--marker);border-radius:8px;display:grid;place-items:center;height:36px}
.cite{font-size:12.5px;color:var(--muted)}

@media (hover:hover){
  .story:hover{transform:translateY(-3px) rotate(0)}
  .story:hover .story-go{background:var(--fake);color:#fff}
  .homebtn:hover{background:var(--on-field);color:var(--field)}
  .btn.quit:hover{background:var(--fake);color:#fff;box-shadow:none}
  .btn:hover{background:var(--marker);color:var(--ink)}
  .btn.cta:hover{background:var(--on-field)}
  .opt:hover{background:var(--marker)}
  .tool:hover:not(:disabled){border-color:var(--ink)}
  .call.share:hover{background:var(--real);border-color:var(--real);color:#fff}
  .call.pass:hover{background:var(--tint)}
  .call.ask:hover{background:var(--marker)}
  .level:hover{border-color:var(--on-field)}
  .call.flag:hover{background:var(--fake);border-color:var(--fake);color:#fff}
  .call.share:hover small,.call.flag:hover small{color:#fff}
  .call.ask:hover small{color:var(--ink)}
  .tchip:hover:not(:disabled){background:var(--marker)}
}
.btn:active,.opt:active,.call:active,.level:active,.coach-next:active,.tool:active:not(:disabled),.tchip:active:not(:disabled){transform:scale(.97)}

@media (max-width:900px){
  .app{padding:0 16px 48px}
  .top{padding-top:12px;gap:8px}
  .brand{font-size:21px}
  .score{font-size:14px}
  .guidebtn{padding:4px 9px;font-size:12px}
  .homebtn{padding:4px 9px 4px 7px;font-size:12px}
  .homebtn svg{width:14px;height:14px}
  .lang button{padding:3px 8px;font-size:12px}
  .steps{display:none}
  .grid,body[data-screen="intro"] .grid{grid-template-columns:minmax(0,1fr);gap:18px;margin-top:10px}
  .town{order:-1;top:0;z-index:5;background:var(--field);margin:0 -16px;padding:8px 16px 8px;gap:4px;border-bottom:1px solid var(--field-deep)}
  .tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tally li{gap:0}
  .tally b{font-size:24px}
  .tally span{font-size:11.5px;gap:5px}
  .tally i{width:8px;height:8px}
  .tally .p i{border-width:2px}
  #net{aspect-ratio:auto;height:112px}
  .hand,.fine.mapnote,.demo{display:none}
  .title{font-size:clamp(64px,21vw,120px)}
}
@media (max-width:420px){
  .tools{gap:6px}
  .tool{font-size:12px}
  .calls{grid-template-columns:minmax(0,1fr)}
  .stamp{font-size:46px}
}
@media (prefers-reduced-motion:reduce){.stamp.fresh{animation:none}.phone.glow-bad.shake{animation:glowBad 1s ease-out}}

      <ul class="hand" id="hand"></ul>
    </aside>
  </div>
</div>

     2. NETWORK   seeded graph + spread simulation drawn on <canvas>
     3. STATE     one plain-JSON object; every screen renders from it
     4. VIEWS     one function per screen, returns an HTML string
     5. ACTIONS   click handlers, dispatched through data-act attributes

   key next to en/zh everywhere and a button in renderTop().

function buildSteps(story) {

      honest:T("Your own account, @jamie.k", "你自己的账号 @jamie.k"), honestAcc: OWN_ACCOUNT };
    if (st.slot === "crowd") return { ...st,
      honest:T("Leave it alone and see who shares it", "什么都不做,看谁会转"), honestShow:T("3 likes", "3 个赞"),
      mild:T(`Ask five friends to comment “${story.crowdLine.en}”`, `让五个朋友来评论“${story.crowdLine.zh}”`),
      mildShow:T(`5 comments: “${story.crowdLine.en}”`, `5 条评论:“${story.crowdLine.zh}”`),
      fake:T("Buy 5,000 likes from a bot service", "从刷量平台买 5000 个赞"), fakeShow:T("5,000 likes in 10 minutes", "10 分钟内 5000 个赞") };
    return { ...st, ...story[st.slot] };
  });
}

/* ---------- 2. NETWORK ---------- */

const N_NODES = 96;
const NET = (() => {
  // Deterministic layout so every player sees the same town.
  let seed = 11;
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pts = [];
  const far = (a, b) => Math.hypot((a.x - b.x) * 1.25, a.y - b.y);
  let guard = 0, gap = 0.085;
  while (pts.length < N_NODES) {
    const p = { x: 0.03 + rnd() * 0.94, y: 0.05 + rnd() * 0.9 };
    if (pts.every(q => far(p, q) > gap)) pts.push(p);
    if (++guard % 4000 === 0) gap *= 0.92;       // relax if the canvas is getting crowded
  }
  const adj = pts.map(() => new Set());
  pts.forEach((p, i) => {
    pts.map((q, j) => [far(p, q), j]).filter(d => d[1] !== i).sort((a, b) => a[0] - b[0]).slice(0, 3)
       .forEach(([, j]) => { adj[i].add(j); adj[j].add(i); });
  });
  // Stitch any islands onto the main component.
  for (;;) {
    const seen = new Set([0]), q = [0];
    while (q.length) for (const m of adj[q.shift()]) if (!seen.has(m)) { seen.add(m); q.push(m); }
    if (seen.size === N_NODES) break;
    let best = [Infinity, 0, 0];
    for (const a of seen) for (let b = 0; b < N_NODES; b++) if (!seen.has(b)) { const d = far(pts[a], pts[b]); if (d < best[0]) best = [d, a, b]; }
    adj[best[1]].add(best[2]); adj[best[2]].add(best[1]);
  }
  const nearest = (x, y) => pts.reduce((bi, p, i) => far(p, { x, y }) < far(pts[bi], { x, y }) ? i : bi, 0);
  return { pts, adj: adj.map(s => [...s]), you: nearest(0.5, 0.5), corners: [nearest(0.08, 0.1), nearest(0.92, 0.9), nearest(0.92, 0.1), nearest(0.08, 0.9)] };
})();

// Node states: 0 hasn't seen it, 1 misled, 2 got the facts, 3 protected.
let shown = [], pulses = [], raf = 0;
const reduceMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

/* Turn up to k untouched nodes into state `to`, walking outward from `seed`.
   Misinformation cannot travel through protected nodes. Returns how many changed. */
function spread(to, k, seed, stagger = 70) {
  const seen = new Set([seed]), queue = [seed], changed = [];
  while (queue.length && changed.length < k) {
    const n = queue.shift();
    if (state.nodes[n] === 0 && n !== NET.you) changed.push(n);
    for (const m of NET.adj[n]) {
      if (seen.has(m)) continue;
      if (to === 1 && state.nodes[m] === 3) continue;
      seen.add(m); queue.push(m);
    }
  }
  const now = performance.now();
  changed.forEach((n, i) => { state.nodes[n] = to; pulses.push({ n, to, t0: now + i * stagger }); });
  if (reduceMotion()) syncNet(); else kick();
  return changed.length;
}
function syncNet() { shown = state.nodes.slice(); pulses = []; draw(performance.now()); }
function kick() { if (!raf) raf = requestAnimationFrame(tick); }
function tick(now) {
  raf = 0;
  let live = false;
  for (const p of pulses) { if (now >= p.t0) shown[p.n] = p.to; if (now < p.t0 + 650) live = true; }
  draw(now);
  if (live) kick(); else pulses = [];
}

const canvas = document.getElementById("net");
const ctx = canvas.getContext ? canvas.getContext("2d") : null;
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();   // body carries the per-screen theme
function draw(now) {
  if (!ctx) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const C = { idle: css("--field-soft"), fake: css("--fake-lit"), real: css("--real-lit"), field: css("--field"), marker: css("--pop"), line: css("--net-line"), guard: css("--guard"), text: css("--on-field") };
  const r = Math.max(3.2, Math.min(8, Math.min(w, h) / 50));
  const P = i => [r + NET.pts[i].x * (w - 2 * r), r + NET.pts[i].y * (h - 2 * r)];

  ctx.lineWidth = 1; ctx.strokeStyle = C.line; ctx.beginPath();
  NET.adj.forEach((ns, i) => ns.forEach(j => { if (j > i) { const [a, b] = P(i), [c, d] = P(j); ctx.moveTo(a, b); ctx.lineTo(c, d); } }));
  ctx.stroke();

  for (const p of pulses) {
    const t = (now - p.t0) / 650; if (t < 0 || t > 1) continue;
    const [x, y] = P(p.n);
    ctx.beginPath(); ctx.arc(x, y, r + t * r * 3, 0, Math.PI * 2);
    ctx.strokeStyle = p.to === 1 ? C.fake : p.to === 2 ? C.real : C.guard;
    ctx.globalAlpha = 1 - t; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
  }

  NET.pts.forEach((_, i) => {
    if (i === NET.you) return;
    const [x, y] = P(i), s = shown[i] || 0;
    ctx.beginPath(); ctx.arc(x, y, s === 3 ? r * 0.8 : r, 0, Math.PI * 2);
    if (s === 3) { ctx.fillStyle = C.field; ctx.fill(); ctx.lineWidth = r * 0.5; ctx.strokeStyle = C.guard; ctx.stroke(); }
    else { ctx.fillStyle = s === 1 ? C.fake : s === 2 ? C.real : C.idle; ctx.fill(); }
  });

  // You: a yellow diamond.
  const [yx, yy] = P(NET.you);
  ctx.save(); ctx.translate(yx, yy); ctx.rotate(Math.PI / 4);
  ctx.fillStyle = C.marker; ctx.fillRect(-r * 1.15, -r * 1.15, r * 2.3, r * 2.3); ctx.restore();
  if (h > 220) {
    ctx.font = `700 13px ${css("--body")}`; ctx.fillStyle = C.text; ctx.textBaseline = "middle";
    ctx.fillText(L(UI.you), yx + r * 2.2, yy);
  }
}
if (window.ResizeObserver) new ResizeObserver(() => draw(performance.now())).observe(canvas);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw(performance.now()));

/* ---------- 3. STATE ---------- */

let state;
const fresh = (keep = {}) => ({
  lang: keep.lang || ((navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en"),
  level: keep.level || "normal",
  guide: { on: keep.guide ? keep.guide.on : true, at: 0, pick0: 0, post: 0 },   // see GUIDE below
  screen: "intro",                       // intro | forge | forgeEnd | feed | result
  forge: { picks: [], story: null, last: keep.forge ? keep.forge.story || keep.forge.last : null },   // chosen story id, last game's story, and "honest" | "mild" | "fake" per step
  deck: [],                              // post ids dealt for this run
  recent: keep.deck && keep.deck.length ? keep.deck : (keep.recent || []),   // last game's posts, drawn less often
  feed: { i: 0, checks: [], verdict: null, guess: null, changed: 0, t0: 0, choices: [], timedOut: false },
  score: 0,
  streak: 0,                             // right calls in a row
  log: [],                               // { id, verdict, ok: true|false|null, trick: true|false|null }
  nodes: new Array(N_NODES).fill(0),
});

const L = o => o[state.lang];
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const num = n => n.toLocaleString("en-US");
const count = s => state.nodes.filter(x => x === s).length;
const level = () => LEVELS[state.level];
const post = () => POST_BY_ID[state.deck[state.feed.i]];
const shuffle = list => { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* The story the player picked for this game. */
const story = () => STORY_BY_ID[state.forge.story] || STORIES[0];
const forgeSteps = () => STEPS_BY_STORY[story().id];
const multOf = (step, pick) => pick === "fake" ? step.mult : pick === "mild" ? step.mildMult : FORGE.honestMult;
const forgeReach = picks => Math.round(picks.reduce((r, p, i) => r * multOf(forgeSteps()[i], p), FORGE.base));

/* Pick this run's posts: the right number of fakes and true ones, biased by the level. */
/* Each game draws a fresh random set. Weights tilt the draw toward the level's difficulty
   without fixing it, and posts from the previous game are much less likely to come back. */
const LEVEL_WEIGHTS = { easy:{1:6, 2:2, 3:0.4}, mixed:{1:1, 2:1, 3:1}, hard:{1:0.4, 2:2, 3:5} };
const RECENT_WEIGHT = 0.12;
function drawPosts(pool, n, weight) {
  const left = pool.slice(), out = [];
  while (out.length < n && left.length) {
    const total = left.reduce((t, p) => t + weight(p), 0);
    let r = Math.random() * total, i = 0;
    while (i < left.length - 1 && (r -= weight(left[i])) > 0) i++;
    out.push(left.splice(i, 1)[0]);
  }
  return out;
}
function deal(lv, recent = []) {
  const w = LEVEL_WEIGHTS[lv.prefer], seen = new Set(recent);
  const weight = p => w[p.level] * (seen.has(p.id) ? RECENT_WEIGHT : 1);
  const take = (truth, n) => drawPosts(POSTS.filter(p => p.truth === truth), n, weight);
  return shuffle([...take("fake", lv.posts - lv.reals), ...take("real", lv.reals)]).map(p => p.id);
}
const maxScore = () => state.deck.reduce((s, id) => s + (POST_BY_ID[id].truth === "fake" ? RULES.fake.flag[2] + TRICK_BONUS : RULES.real.share[2]), 0);

let timerId = 0;
function armTimer() {
  clearTimeout(timerId);
  const T = level().timer;
  if (state.screen !== "feed" || !T || state.feed.verdict) return;
  timerId = setTimeout(() => ACTIONS.verdict("pass", true), Math.max(0, T * 1000 - (Date.now() - state.feed.t0)));
}
function openPost(i) {
  const p = POST_BY_ID[state.deck[i]], n = level().trickChoices;
  let choices = TRICK_ORDER;
  if (n < TRICK_ORDER.length && p.tricks.length) {             // easier levels: fewer wrong answers
    const keep = new Set([...p.tricks, ...shuffle(TRICK_ORDER.filter(t => !p.tricks.includes(t))).slice(0, n - p.tricks.length)]);
    choices = TRICK_ORDER.filter(t => keep.has(t));
  }
  state.feed = { i, checks: [], verdict: null, guess: null, changed: 0, t0: Date.now(), choices, timedOut: false };
  armTimer();
}

/* The first-round guide. Steps run in order. A step shows when `ready`, and is skipped once
   `passed` (the player already did it) or once the game has moved to a later screen.
   Steps with `btn` wait for that button; the others wait for the player's own action. */
const SCREENS = ["intro", "pickStory", "forge", "forgeEnd", "feed", "result"];
const picked = s => s.forge.picks.length;
const onPost = (s, g) => s.feed.i === g.post;
const flaggedFake = s => s.feed.verdict === "flag" && post().truth === "fake";
const whereMap = () => L(UI.where[window.matchMedia && window.matchMedia("(max-width:900px)").matches ? "top" : "side"]);
const GUIDE = [
  { id:"story", screen:"pickStory", target:".stories", place:"before",
    ready:() => true, passed:() => false },
  { id:"truth", screen:"forge", target:".truth", place:"after", btn:"next",
    ready:(s, g) => picked(s) === g.pick0, passed:(s, g) => picked(s) > g.pick0 },
  { id:"pick", screen:"forge", target:".opts", place:"before",
    ready:(s, g) => picked(s) === g.pick0, passed:(s, g) => picked(s) > g.pick0 },
  { id:"post", screen:"forge", target:".phone", place:"before", btn:"next",
    ready:(s, g) => picked(s) > g.pick0, passed:(s, g) => picked(s) > g.pick0 + 1 },
  { id:"town", screen:"forge", target:".map", place:"stage", btn:"ok",
    ready:(s, g) => picked(s) > g.pick0, passed:(s, g) => picked(s) > g.pick0 + 2,
    vars:s => ({ where: whereMap(), left: forgeSteps().length - picked(s) }) },
  { id:"read", screen:"feed", target:".phone .post", place:"before", btn:"next",
    ready:(s, g) => onPost(s, g) && !s.feed.verdict && !s.feed.checks.length, passed:(s, g) => !onPost(s, g) || !!s.feed.verdict || s.feed.checks.length > 0 },
  { id:"tools", screen:"feed", target:".tools", place:"before",
    ready:(s, g) => onPost(s, g) && !s.feed.verdict && !s.feed.checks.length, passed:(s, g) => !onPost(s, g) || !!s.feed.verdict || s.feed.checks.length > 0,
    vars:() => ({ n: level().checks }) },
  { id:"evidence", screen:"feed", target:".tray .ev", place:"after", btn:"next",
    ready:(s, g) => onPost(s, g) && !s.feed.verdict && s.feed.checks.length > 0, passed:(s, g) => !onPost(s, g) || !!s.feed.verdict,
    vars:() => ({ hint: level().hints ? L(UI.hintTag) : "" }) },
  { id:"calls", screen:"feed", target:".calls", place:"before",
    ready:(s, g) => onPost(s, g) && !s.feed.verdict, passed:(s, g) => !onPost(s, g) || !!s.feed.verdict },
  { id:"outcome", screen:"feed", target:".outcome", place:"before", btn:"next",
    ready:(s, g) => onPost(s, g) && !!s.feed.verdict, passed:(s, g) => !onPost(s, g),
    vars:() => ({ where: whereMap() }) },
  { id:"trick", screen:"feed", target:".chips", place:"before",
    ready:(s, g) => onPost(s, g) && flaggedFake(s) && s.feed.guess === null,
    passed:(s, g) => !onPost(s, g) || s.feed.guess !== null || (!!s.feed.verdict && !flaggedFake(s)) },
  { id:"next", screen:"feed", target:".nextrow", place:"before",
    ready:(s, g) => onPost(s, g) && !!s.feed.verdict, passed:(s, g) => !onPost(s, g) },
];
function guideStep() {
  const g = state.guide, here = SCREENS.indexOf(state.screen);
  if (!g.on) return null;
  while (g.at < GUIDE.length) {
    const st = GUIDE[g.at], there = SCREENS.indexOf(st.screen);
    if (there < here || (there === here && st.passed(state, g))) { g.at++; continue; }
    return there === here && st.ready(state, g) ? st : null;
  }

}
function mountGuide(st) {
  document.querySelectorAll(".guided").forEach(el => el.classList.remove("guided"));   // the map outlives a re-render
  const target = st && document.querySelector(st.target);
  if (!target) return;
  target.classList.add("guided");
  const el = document.createElement("div");
  el.className = "coach " + (st.place === "after" ? "up" : st.place === "before" ? "down" : "");
  el.setAttribute("role", "status");
  el.innerHTML = `<p>${fill(L(UI.guide[st.id]), st.vars ? st.vars(state) : {})}</p>
    <div class="coach-btns">${st.btn ? `<button class="coach-next" data-act="guideNext">${L(UI.guideBtn[st.btn])}</button>` : ""}</div>`;
  if (st.place === "stage") document.querySelector("#stage .brief").insertAdjacentElement("afterend", el);
  else target.insertAdjacentElement(st.place === "after" ? "afterend" : "beforebegin", el);
  // Keep the tip on screen. On phones the town band is pinned to the top and would cover it.
  const band = window.matchMedia && window.matchMedia("(max-width:900px)").matches ? document.getElementById("town").offsetHeight : 0;
  el.style.scrollMarginTop = band + 16 + "px";
  const r = el.getBoundingClientRect();

  const acc = val("account"), img = val("image");

function reachRow(picks) {

/* Forger score, 0 to 100: where your reach sits between telling the truth at every step (0)
   and using the full trick at every step (100), on a log scale because each trick multiplies reach. */
function forgeScore(picks) {
  const n = forgeSteps().length;
  const honest = FORGE.base * Math.pow(FORGE.honestMult, n);
  const max = forgeSteps().reduce((r, st) => r * st.mult, FORGE.base);
  const reach = picks.reduce((r, pk, i) => r * multOf(forgeSteps()[i], pk), FORGE.base);
  return Math.max(0, Math.min(100, Math.round(100 * Math.log(reach / honest) / Math.log(max / honest))));
}
const forgeRank = score => UI.fsRanks.filter(r => score >= r.min).pop();
function forgeScoreCard(picks, animate) {
  const score = forgeScore(picks), rank = forgeRank(score);
  return `<section class="fscore" aria-label="${L(UI.fsLabel)}">
    <div class="fs-top">
      <div class="fs-num"><span class="fs-label">${L(UI.fsLabel)}</span><b data-to="${score}">${animate ? 0 : score}</b><small>/100</small></div>
      <div class="fs-rank"><b class="disp">${L(rank.name)}</b><span>${L(rank.desc)}</span></div>
    </div>
    <div class="fs-meter" aria-hidden="true"><i style="width:${animate ? 0 : score}%"></i></div>
    <span class="sub">${L(UI.fsSteps)}</span>
    <ol class="fs-steps">${forgeSteps().map((st, i) => { const pk = picks[i];
      return `<li><span class="fs-slot">${L(UI.slots[st.slot])}</span><span class="pill fs-${pk}">${L(UI.pickName[pk])}</span>
        <span class="fs-trick">${pk === "honest" ? "" : L(TRICKS[st.trick].name)}</span><span class="fs-mult">×${multOf(st, pk)}</span></li>`; }).join("")}</ol>
    <p class="fs-note">${L(UI.fsNote)}</p>
  </section>`;
}
function animateForgeScore() {
  const b = document.querySelector(".fs-num b"), bar = document.querySelector(".fs-meter i");
  if (!b) return;
  const to = +b.dataset.to, t0 = performance.now(), dur = 1100;
  requestAnimationFrame(() => { if (bar) bar.style.width = to + "%"; });
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    if (!b.isConnected) return;
    b.textContent = Math.round(to * easeOut(k));
    if (k < 1) requestAnimationFrame(step); else sfx(to >= 50 ? "bonus" : "safe");
  };
  requestAnimationFrame(step);
}

    const scoring = fill(L(UI.scoring), { r: pts(RULES.real.share[2]), a1: pts(RULES.real.ask[2]), a2: pts(RULES.fake.ask[2]), w1: pts(RULES.real.flag[2]), w2: pts(RULES.fake.share[2]) });

/* ---------- TRANSITIONS ----------
   Three scene changes, drawn on one full-screen canvas laid over the page:
     forge   a rubber stamp slams down and red ink spreads from the centre
     feed    a drop of black ink falls, ripples out, and a magnifier opens onto the feed
     result  the magnifier pulls back to a small lens, the view inside it changes, then it opens again
   `swap` changes the screen while the canvas covers it. A click, tap or key skips to the end. */
const FX = {
  forge:  { ms:1500, swap:0.55 },
  feed:   { ms:1650, swap:0.60 },
  result: { ms:1500, swap:0.52 },
};
const INK = "#090B22";
let fx = null;
/* Transitions play by default, even with the system's "reduce motion" on, because they are part of the show.
   Players can switch them off on the home screen; the choice is remembered in this browser. */
const MOTION_KEY = "capfact-transitions";
let fxOn = true;
try { fxOn = localStorage.getItem(MOTION_KEY) !== "off"; } catch (e) {}
function setFx(on) { fxOn = on; try { localStorage.setItem(MOTION_KEY, on ? "on" : "off"); } catch (e) {} }

const clamp01 = x => Math.max(0, Math.min(1, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

function playTransition(kind, swap, done) {
  if (fx) endFx();
  if (!fxOn) { swap(); done && done(); return; }
  const cv = document.createElement("canvas");
  cv.className = "fx"; cv.setAttribute("aria-hidden", "true");
  document.body.appendChild(cv);
  const rnd = Math.random;
  // The ink drop and the magnifier land on the phone column, so the lens shows the feed, not the map.
  const st = document.getElementById("stage").getBoundingClientRect();
  const focusX = kind === "forge" ? 0.5 : clamp01((st.left + st.width / 2) / innerWidth) || 0.5;
  fx = { kind, cv, focusX: Math.max(0.2, Math.min(0.8, focusX)), ctx: cv.getContext("2d"), t0: performance.now(), ...FX[kind], swapped: false, swapFn: swap, done, shook: false,
         ph: [rnd() * 6.3, rnd() * 6.3, rnd() * 6.3],
         drops: Array.from({ length: 30 }, () => ({ a: rnd() * Math.PI * 2, d: 0.55 + rnd() * 0.75, s: 3 + rnd() * 15, e: 1 + rnd() * 1.4 })) };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); endFx(); });
  requestAnimationFrame(fxFrame);
}
function doSwap() { if (fx && !fx.swapped) { fx.swapped = true; fx.swapFn(); } }
function endFx() {
  if (!fx) return;
  doSwap();
  fx.cv.remove();
  const done = fx.done; fx = null;
  done && done();
}
function fxFrame(now) {
  if (!fx) return;
  const t = clamp01((now - fx.t0) / fx.ms), cv = fx.cv, ctx = fx.ctx;
  const w = innerWidth, h = innerHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cx = w * fx.focusX, cy = h / 2;
  const g = { ctx, w, h, cx, cy, R: Math.hypot(Math.max(cx, w - cx), cy) * 1.12, m: Math.min(w, h) };
  FX_DRAW[fx.kind](t, g);
  if (t > 0.08 && t < 0.9) skipHint(g, Math.min(1, (t - 0.08) * 6) * Math.min(1, (0.9 - t) * 6));
  if (t >= fx.swap) doSwap();
  if (t >= 1) endFx(); else requestAnimationFrame(fxFrame);
}

/* An ink blot: a circle with a wobbly edge. */
function blob(ctx, cx, cy, r, ph) {
  ctx.beginPath();
  for (let i = 0; i <= 64; i++) {
    const a = i / 64 * Math.PI * 2;
    const k = 1 + 0.07 * Math.sin(3 * a + ph[0]) + 0.05 * Math.sin(7 * a + ph[1]) + 0.03 * Math.sin(13 * a + ph[2]);
    const x = cx + Math.cos(a) * r * k, y = cy + Math.sin(a) * r * k;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function splatter(g, r, color, scale = 1) {
  const { ctx, cx, cy } = g;
  ctx.fillStyle = color;
  for (const d of fx.drops) {
    const dist = r * d.d + d.s * 2;
    ctx.save(); ctx.translate(cx + Math.cos(d.a) * dist, cy + Math.sin(d.a) * dist); ctx.rotate(d.a);
    ctx.beginPath(); ctx.ellipse(0, 0, d.s * d.e * scale, d.s * scale, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}
function shake() {
  if (fx.shook) return; fx.shook = true;
  if (reduceMotion()) return;   // keep the stamp, drop the screen shake
  document.querySelector(".app")?.animate?.([{ transform: "translate(0,0)" }, { transform: "translate(-7px,5px)" }, { transform: "translate(6px,-4px)" }, { transform: "translate(-3px,2px)" }, { transform: "translate(0,0)" }], { duration: 240 });
}
function skipHint(g, a) {
  const { ctx, w, h } = g;
  ctx.save(); ctx.globalAlpha = a * 0.75; ctx.fillStyle = "#fff";
  ctx.font = `600 13px ${css("--body")}`; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillText(L(UI.skipFx), w / 2, h - 18); ctx.restore();
}
function stamp(g, scale, alpha, color) {
  const { ctx, cx, cy, m } = g, text = L(UI.stampFake);
  const size = Math.min(150, m * 0.17);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-11 * Math.PI / 180); ctx.scale(scale, scale); ctx.globalAlpha = alpha;
  ctx.font = `900 ${size}px ${css("--display")}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const tw = ctx.measureText(text).width, pw = tw + size * 0.55, ph = size * 1.12, lw = size * 0.09;
  ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-pw / 2, -ph / 2, pw, ph, size * 0.14) : ctx.rect(-pw / 2, -ph / 2, pw, ph); ctx.stroke();
  ctx.fillText(text, 0, size * 0.04);
  ctx.restore();
}
/* The magnifier: a clear lens cut out of the ink, a yellow rim and a handle. */
function lens(g, r, alpha = 1) {
  const { ctx, cx, cy } = g;
  ctx.save(); ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  if (alpha <= 0) return;
  const lw = Math.max(9, r * 0.075), marker = css("--marker");
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = "round";
  const a = Math.PI / 4, x0 = cx + Math.cos(a) * (r + lw * 0.4), y0 = cy + Math.sin(a) * (r + lw * 0.4);
  ctx.strokeStyle = marker; ctx.lineWidth = lw * 1.5;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.cos(a) * r * 0.95, y0 + Math.sin(a) * r * 0.95); ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = lw * 1.1;
  ctx.beginPath(); ctx.moveTo(x0 + Math.cos(a) * r * 0.42, y0 + Math.sin(a) * r * 0.42); ctx.lineTo(x0 + Math.cos(a) * r * 0.9, y0 + Math.sin(a) * r * 0.9); ctx.stroke();
  ctx.strokeStyle = marker; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.arc(cx, cy, r + lw / 2, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = lw * 0.45;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.8, Math.PI * 1.08, Math.PI * 1.36); ctx.stroke();
  ctx.restore();
}
const FX_DRAW = {
  forge(t, g) {
    const { ctx, w, h, cx, cy, R } = g, red = css("--fake"), sw = fx.swap;
    const hit = 0.22, inkP = clamp01((t - hit) / (sw - hit - 0.02));
    if (t < sw) {
      ctx.fillStyle = `rgba(10,14,60,${0.38 * clamp01(t / 0.15)})`; ctx.fillRect(0, 0, w, h);
      if (t >= hit) {
        shake();
        const r = R * easeOut(inkP);
        ctx.fillStyle = red; blob(ctx, cx, cy, r, fx.ph); ctx.fill();
        if (inkP < 1) splatter(g, r, red);
      }
    } else {
      ctx.fillStyle = red; ctx.fillRect(0, 0, w, h);
      ctx.save(); ctx.globalCompositeOperation = "destination-out";
      blob(ctx, cx, cy, R * 1.1 * easeInOut(clamp01((t - sw) / (1 - sw))), [fx.ph[2], fx.ph[0], fx.ph[1]]); ctx.fill();
      ctx.restore();
    }
    if (t < hit) stamp(g, 2.6 - 1.6 * easeIn(t / hit), clamp01(t / hit * 1.4), red);
    else if (t < sw + 0.25) stamp(g, 1 + (t > sw ? 0.7 * easeIn((t - sw) / 0.25) : 0), t > sw ? 1 - (t - sw) / 0.25 : 1, t < hit + 0.04 ? red : "#fff");
  },
  feed(t, g) {
    const { ctx, w, h, cx, cy, R, m } = g, sw = fx.swap, hit = 0.26;
    if (t < hit) {
      const p = easeIn(t / hit) , y = -80 + (cy + 80) * p, s = Math.max(14, m * 0.034), stretch = 1 + p * 0.9;
      ctx.fillStyle = `rgba(9,11,34,${0.25 * clamp01(t / 0.12)})`; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.moveTo(cx, y - s * 2.4 * stretch);
      ctx.bezierCurveTo(cx + s * 0.3, y - s * 1.2, cx + s, y - s * 0.6, cx + s, y);
      ctx.arc(cx, y, s, 0, Math.PI); ctx.bezierCurveTo(cx - s, y - s * 0.6, cx - s * 0.3, y - s * 1.2, cx, y - s * 2.4 * stretch);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(cx - s * 0.35, y - s * 0.2, s * 0.22, 0, Math.PI * 2); ctx.fill();
      return;
    }
    const inkP = clamp01((t - hit) / (sw - hit - 0.02));
    if (t < sw) {
      ctx.fillStyle = "rgba(9,11,34,.25)"; ctx.fillRect(0, 0, w, h);
      const r = R * easeOut(inkP);
      ctx.fillStyle = INK; blob(ctx, cx, cy, r, fx.ph); ctx.fill();
      if (inkP < 0.6) splatter(g, r * 0.9, INK, 0.5);
    } else { ctx.fillStyle = INK; ctx.fillRect(0, 0, w, h); }
    for (let k = 0; k < 4; k++) {            // ripples
      const p = clamp01((t - hit - k * 0.07) / 0.5); if (p <= 0 || p >= 1) continue;
      ctx.strokeStyle = `rgba(255,255,255,${0.42 * (1 - p)})`; ctx.lineWidth = 3 - k * 0.5;
      ctx.beginPath(); ctx.ellipse(cx, cy, m * 0.05 + p * R * 0.9, (m * 0.05 + p * R * 0.9) * 0.82, 0, 0, Math.PI * 2); ctx.stroke();
    }
    if (t >= sw) {
      const p = (t - sw) / (1 - sw), rs = m * 0.21;
      const r = p < 0.38 ? rs * easeBack(p / 0.38) : rs + (R * 1.15 - rs) * easeIn((p - 0.38) / 0.62);
      lens(g, Math.max(0, r));
    }
  },
  result(t, g) {
    const { ctx, w, h, cx, cy, R, m } = g, sw = fx.swap, rs = m * 0.22, big = R * 1.15;
    const r = t < 0.46 ? big + (rs - big) * easeInOut(t / 0.46)
            : t < 0.58 ? rs * (1 - 0.04 * Math.sin((t - 0.46) / 0.12 * Math.PI))
            : rs + (big - rs) * easeIn((t - 0.58) / 0.42);
    ctx.fillStyle = INK; ctx.fillRect(0, 0, w, h);
    lens(g, r, clamp01((big - r) / (big * 0.25)));
    if (t >= sw && t < sw + 0.12) {          // the view inside the lens changes with a flash
      ctx.fillStyle = `rgba(255,255,255,${0.55 * (1 - (t - sw) / 0.12)})`;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
  },
};

/* ---------- FEEDBACK ----------
   After each call: a result bar in the phone, a glow (and a shake when wrong) on the phone,
   the score counting to its new value with a floating +/-, a short sound, and a buzz on phones. */
const SOUND_KEY = "capfact-sound";
let sfxOn = true, actx = null;
try { sfxOn = localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) {}
function setSfx(on) { sfxOn = on; try { localStorage.setItem(SOUND_KEY, on ? "on" : "off"); } catch (e) {} }
function sfx(kind) {
  if (!sfxOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime;
    const tone = (f, at, dur, type = "triangle", vol = 0.16, f2) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + at);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + dur);
      g.gain.setValueAtTime(0.0001, t + at);
      g.gain.exponentialRampToValueAtTime(vol, t + at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
      o.connect(g).connect(actx.destination); o.start(t + at); o.stop(t + at + dur + 0.03);
    };
    if (kind === "good") { tone(659, 0, 0.14); tone(988, 0.1, 0.24); }
    else if (kind === "bonus") { tone(784, 0, 0.1); tone(1047, 0.08, 0.1); tone(1319, 0.16, 0.2); }
    else if (kind === "bad") { tone(220, 0, 0.34, "sawtooth", 0.07, 110); tone(233, 0, 0.34, "square", 0.03, 117); }
    else if (kind === "safe") tone(587, 0, 0.18, "sine", 0.13);
    else tone(330, 0, 0.12, "sine", 0.07);
  } catch (e) {}
}
const fbKind = (ok, pts, timedOut) => timedOut ? "time" : ok === true ? "good" : ok === false ? "bad" : pts > 0 ? "safe" : "none";
const signed = n => (n > 0 ? "+" : n < 0 ? "\u2212" : "") + Math.abs(n);
function bumpScore(from, to) {
  const el = document.querySelector(".score"); if (!el || from === to) return;
  const label = L(UI.score), t0 = performance.now(), dur = 550;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), v = Math.round(from + (to - from) * easeOut(k));
    if (el.isConnected) { el.firstChild.nodeValue = `${label} ${num(v)}`; if (k < 1) requestAnimationFrame(step); }
  };
  el.firstChild.nodeValue = `${label} ${num(from)}`; requestAnimationFrame(step);
  const d = document.createElement("span");
  d.className = "delta " + (to > from ? "up" : "down"); d.textContent = signed(to - from); d.setAttribute("aria-hidden", "true");
  el.appendChild(d); setTimeout(() => d.remove(), 1200);
}
function feedback(kind, from, to) {
  sfx(kind === "time" ? "none" : kind);
  if (kind === "bad") { try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch (e) {} }
  const ph = document.querySelector("#stage .phone");
  if (ph && (kind === "good" || kind === "bad")) {
    ph.classList.add(kind === "good" ? "glow-good" : "glow-bad");
    if (kind === "bad" && !reduceMotion()) ph.classList.add("shake");
  }
  bumpScore(from, to);
}

/* ---------- 5. ACTIONS ---------- */

const ACTIONS = {
  lang(v) { if (v !== state.lang) { state.lang = v; render(); renderModal(); } },
  level(v) { if (LEVELS[v]) { state.level = v; render(); } },
  fx(v) { setFx(v === "on"); render(); },
  sfx(v) { setSfx(v === "on"); render(); if (sfxOn) sfx("good"); },
  guideNext() { state.guide.at++; render(); },
  guideToggle() {   // switching it back on restarts the guide from wherever the player is now
    state.guide = state.guide.on ? { ...state.guide, on: false } : { on: true, at: 0, pick0: state.forge.picks.length, post: state.feed.i };
    render();
  },
  start() {
    playTransition("forge", () => {
      state.nodes = new Array(N_NODES).fill(0); syncNet();
      state.screen = "pickStory"; render({ top: true });
    });
  },
  story(v) {
    if (!STORY_BY_ID[v] || state.screen !== "pickStory") return;
    state.forge = { ...state.forge, story: v, picks: [] };
    state.screen = "forge"; render({ top: true });
  },
  pick(v) {
    state.forge.picks.push(v);
    if (v === "fake") spread(1, 11, NET.you); else if (v === "mild") spread(1, 6, NET.you); else spread(2, 1, NET.you);
    if (state.forge.picks.length === forgeSteps().length) {
      state.screen = "forgeEnd";
      render({ scoreIn: true });
      animateForgeScore();
      return;
    }
    render();
  },
  toFeed() {
    playTransition("feed", () => {
      state.nodes = new Array(N_NODES).fill(0); syncNet();
      state.deck = deal(level(), state.recent);
      state.screen = "feed"; openPost(0); render({ top: true });
    }, () => {   // the Expert countdown starts once the post is fully in view
      if (state.screen === "feed" && !state.feed.verdict) { state.feed.t0 = Date.now(); armTimer(); renderTown(); }
    });
  },
  check(v) {
    const f = state.feed;
    if (f.verdict || f.checks.includes(v) || f.checks.length >= level().checks) return;
    f.checks.push(v); render();
  },
  verdict(v, timedOut) {
    const f = state.feed, p = post();
    if (f.verdict || state.screen !== "feed") return;
    clearTimeout(timerId);
    const [to, k, pts, ok] = RULES[p.truth][v];
    // An ignored fake keeps spreading from somewhere else in town; everything else starts with you.
    const from = p.truth === "fake" && v === "pass" ? NET.corners[f.i % NET.corners.length] : NET.you;
    f.changed = k ? spread(to, k, from) : 0;
    f.verdict = v; f.timedOut = !!timedOut; f.pts = pts;
    const before = state.score;
    state.score = Math.max(0, state.score + pts);
    state.streak = ok === true ? state.streak + 1 : ok === false ? 0 : state.streak;
    state.log.push({ id: p.id, verdict: v, ok, trick: null });
    render({ freshStamp: true, top: true });
    feedback(fbKind(ok, pts, timedOut), before, state.score);
  },
  guess(v) {
    const f = state.feed, p = post();
    if (f.guess !== null) return;
    f.guess = v;
    const hit = p.tricks.includes(v);
    state.log[state.log.length - 1].trick = hit;
    const before = state.score;
    if (hit) state.score += TRICK_BONUS;
    render();
    sfx(hit ? "bonus" : "none");
    bumpScore(before, state.score);
  },
  next() {
    const i = state.feed.i + 1;
    if (i >= state.deck.length) return playTransition("result", () => { state.screen = "result"; render({ top: true }); });
    openPost(i);
    render({ top: true });
  },
  replay() { goHome(); },
  home() {
    if (state.screen === "intro") return;
    if (state.screen === "result" || state.screen === "pickStory") return goHome();   // nothing to lose yet, or the game is over
    quitOpen = true; pausedAt = Date.now(); clearTimeout(timerId);   // pause the Expert countdown
    renderModal();
  },
  quitYes() { goHome(); },
  quitNo() {
    if (!quitOpen) return;
    quitOpen = false;
    if (state.screen === "feed" && !state.feed.verdict) state.feed.t0 += Date.now() - pausedAt;   // resume where it stopped
    renderModal(); render(); armTimer();
    document.querySelector(".homebtn")?.focus();
  },
};

document.addEventListener("keydown", e => {
  if (fx && ["Enter", " ", "Escape"].includes(e.key)) { e.preventDefault(); endFx(); return; }
  if (quitOpen && e.key === "Escape") ACTIONS.quitNo();
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (fx || !el || el.disabled || !ACTIONS[el.dataset.act]) return;   // nothing behind a transition is clickable
  if (quitOpen && !["quitYes", "quitNo"].includes(el.dataset.act)) return;   // the dialog blocks the game behind it
  ACTIONS[el.dataset.act](el.dataset.v);
});

/* Boot. Inside the Claude viewer, `hot` keeps a player's place across a republish. */
function boot(saved) {
  state = saved && saved.screen && Array.isArray(saved.deck) ? Object.assign(fresh(), saved) : fresh();
  if (state.screen === "feed" && !state.feed.verdict) state.feed.t0 = Date.now();   // a restored timer starts over
  syncNet();
  render();
  armTimer();
  introWave();
  window.claude?.hot?.snapshot?.(() => state);
}
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
</script>
